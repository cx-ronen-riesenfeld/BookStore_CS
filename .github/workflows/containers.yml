name: Checkmarx AST Github Action

on:
  push: 
      branches:
      - master

jobs:
  container_check:
    runs-on: ubuntu-latest
    name: Checkmarx Container
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
       - name: Pull Image from ECR
        run: |
          docker pull 584828065681.dkr.ecr.us-east-1.amazonaws.com/demo-app:latest        
      - name: analizar
        uses: Checkmarx/ast-github-action@2.3.36
        with:
          base_uri: https://ast.checkmarx.net/
          cx_tenant: latam
          cx_client_id: github_container
          cx_client_secret: QLCdIyLOOcLYwKBMunEhgpzi1zJbkVnzAfiEJxq0ITRxEt2RSHCIWDdpnV2pvGqP1iHgn3ImZcE3eBf2g2gg4M
          project_name: ${{ github.repository }}
          branch: ${{ github.head_ref || github.ref }}
          scan_params: --s . --scan-types container-security --containers-local-resolution
